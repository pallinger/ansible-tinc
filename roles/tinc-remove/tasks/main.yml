---

- name: delete tinc netname directory
  file: >
    path=/etc/tinc/{{ netname }}
    state=absent
  tags: delete_tinc_config

- name: remove {{ netname }} from /etc/tinc/nets.boot file
  lineinfile: >
    dest=/etc/tinc/nets.boot
    line="{{ netname }}"
    mode=0644
    state=absent
  notify:
    - restart tinc
  tags: delete_tinc_config

- name: read /etc/tinc/nets.boot
  ansible.builtin.shell:
    cmd: "grep -v '^#' /etc/tinc/nets.boot | wc -l"
  register: nets_boot
  changed_when: false
  tags: slurp

- name: remove tinc package if /etc/tinc/nets.boot is empty
  package:
    name: tinc
    state: absent
  when: nets_boot.stdout | int == 0
  tags: package
